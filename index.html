<head>

<style>
:root{--bg:#f7f9fc;--paper:#fff;--ink:#172033;--muted:#657189;--line:#9ba9bd;--border:#d9e1eb;--face:#eaf2ff;--face2:#3f72c7;--pose:#e8f7ef;--pose2:#398762;--struct:#fff4da;--struct2:#a87913;--quality:#f3ecff;--quality2:#7856b3;--risk:#fff0ec;--risk2:#c35f49;--time:#e9f7f7;--time2:#287f85;--final:#e8efff;--final2:#315fb4;--shadow:0 8px 22px rgba(35,52,84,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.app{height:100vh;display:grid;grid-template-rows:64px 1fr}.toolbar{background:var(--paper);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 18px;position:relative;z-index:20}.brand{display:flex;align-items:center;gap:10px;margin-right:auto}.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--quality2),var(--face2));color:#fff;display:grid;place-items:center;font-weight:700}.brand strong{display:block;font-size:15px}.brand span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.tool-btn{border:1px solid var(--border);background:var(--paper);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer;font:inherit;font-size:13px}.tool-btn:hover,.tool-btn.active{border-color:var(--final2);background:var(--final);color:#163e87}.workspace{position:relative;overflow:hidden}.canvas-shell{position:absolute;inset:0;overflow:hidden;cursor:grab}.canvas-shell.panning{cursor:grabbing}.scene{position:absolute;left:0;top:0;width:1580px;height:900px;transform-origin:0 0}.paper-grid{position:absolute;inset:0;background-image:radial-gradient(#cfd7e4 1px,transparent 1px);background-size:24px 24px;opacity:.38}.group{position:absolute;border:1.5px dashed var(--border);border-radius:44px;background:rgba(255,255,255,.52);pointer-events:none}.group-label{position:absolute;top:-14px;left:22px;background:var(--bg);padding:3px 9px;color:var(--muted);font-size:12px;font-weight:700;border-radius:10px}.group.input{left:25px;top:145px;width:320px;height:610px}.group.quality{left:365px;top:92px;width:340px;height:350px;background:rgba(243,236,255,.36);border-color:#cfbceb}.group.experts{left:365px;top:485px;width:660px;height:360px}.group.gating{left:730px;top:90px;width:300px;height:355px;background:rgba(243,236,255,.28);border-color:#cfbceb}.group.anxiety{left:1050px;top:135px;width:300px;height:610px;background:rgba(255,240,236,.32);border-color:#e8b5a9}.group.output{left:1370px;top:270px;width:185px;height:330px;background:rgba(232,239,255,.40);border-color:#9db8ed}.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edge{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.edge.quality{stroke:var(--quality2);stroke-dasharray:7 5}.edge.risk{stroke:var(--risk2)}.edge.strong{stroke:var(--final2);stroke-width:3}.edge.hidden-edge{stroke-dasharray:4 5;opacity:.75}.edge-label{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:5px}.node{position:absolute;width:158px;min-height:66px;border:1.5px solid var(--border);border-radius:17px;background:var(--paper);box-shadow:0 4px 13px rgba(35,52,84,.08);padding:10px 11px;text-align:center;cursor:move;user-select:none;z-index:4;transition:box-shadow .18s,border-color .18s,transform .18s}.node:hover{box-shadow:var(--shadow);transform:translateY(-2px)}.node.selected{border-color:var(--final2);box-shadow:0 0 0 4px rgba(49,95,180,.15),var(--shadow)}.node strong{display:block;font-size:13px;line-height:1.35}.node span{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:4px}.node code{display:block;font-size:11px;line-height:1.45;margin-top:5px;white-space:normal}.node.circle{width:116px;height:116px;border-radius:50%;display:flex;flex-direction:column;justify-content:center}.node.hub{width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;border-width:2px}.node.wide{width:196px}.face{background:var(--face);border-color:#b7ccef}.pose{background:var(--pose);border-color:#b9dfca}.struct{background:var(--struct);border-color:#ead296}.quality-node{background:var(--quality);border-color:#cfbceb}.time{background:var(--time);border-color:#a9d6d8}.risk-node{background:var(--risk);border-color:#e8b5a9}.final{background:var(--final);border-color:#9db8ed}.final strong{color:#183f86}.node[hidden]{display:none}.mini{display:inline-block!important;margin:5px auto 0!important;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.75);font-weight:700;color:var(--ink)!important}.legend{position:absolute;left:30px;bottom:21px;display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:4px;display:inline-block}.detail{position:absolute;right:18px;top:82px;width:330px;background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:17px;z-index:18;transform:translateX(calc(100% + 30px));transition:transform .24s}.detail.open{transform:translateX(0)}.detail-head{display:flex;gap:10px}.detail-icon{width:34px;height:34px;border-radius:10px;background:var(--quality);display:grid;place-items:center;color:var(--quality2);font-weight:700}.detail h2{font-size:16px;margin:0 0 4px}.detail .type{font-size:11px;color:var(--muted)}.close{margin-left:auto;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:20px}.detail p{font-size:13px;line-height:1.7;margin:14px 0 0}.detail dl{display:grid;grid-template-columns:70px 1fr;gap:8px;margin:15px 0 0;font-size:12px}.detail dt{color:var(--muted)}.detail dd{margin:0;line-height:1.55}.detail .formula{background:var(--bg);border-radius:10px;padding:9px;margin-top:13px;font:12px/1.6 Consolas,monospace}.zoom{position:absolute;left:18px;top:82px;display:grid;gap:7px;z-index:18}.zoom button{width:38px;height:38px;border:1px solid var(--border);background:var(--paper);border-radius:10px;cursor:pointer;font-size:17px;color:var(--ink);box-shadow:0 3px 10px rgba(35,52,84,.08)}.hint{position:absolute;left:64px;top:86px;color:var(--muted);font-size:11px;z-index:10;background:rgba(247,249,252,.88);padding:5px 8px;border-radius:8px}.narration{position:absolute;left:50%;top:12px;transform:translateX(-50%) translateY(-220px);width:min(700px,calc(100% - 150px));display:grid;grid-template-columns:auto 1fr;column-gap:10px;row-gap:3px;align-items:center;background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:10px 13px;z-index:19;transition:transform .25s}.narration.open{transform:translateX(-50%) translateY(0)}.narration-step{grid-row:1/3;background:var(--quality);color:var(--quality2);border-radius:10px;padding:7px 9px;font-size:11px;font-weight:700}.narration strong{font-size:13px}.narration>span:not(.narration-step){font-size:11px;color:var(--muted)}.progress{grid-column:1/-1;height:3px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px}.progress i{display:block;width:0;height:100%;background:var(--quality2);transition:width .35s}.scenario{position:absolute;left:50%;bottom:18px;transform:translate(-50%,calc(100% + 40px));width:min(920px,calc(100% - 36px));background:rgba(255,255,255,.98);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;z-index:17;transition:transform .25s}.scenario.open{transform:translate(-50%,0)}.scenario-head{display:flex;align-items:center;gap:12px}.scenario select{border:1px solid var(--border);border-radius:9px;background:var(--paper);padding:7px 10px;color:var(--ink);font:inherit}.weights{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:11px}.weight{background:var(--bg);border-radius:11px;padding:8px 10px}.weight span{display:block;font-size:10px;color:var(--muted)}.weight strong{font-size:15px}.scenario-note{font-size:11px;color:var(--muted);margin-left:auto}.bar{height:5px;background:var(--border);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--quality2);transition:width .35s}.pulse{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 4px 13px rgba(35,52,84,.08)}50%{box-shadow:0 0 0 7px rgba(120,86,179,.12),var(--shadow)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:850px){.toolbar{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 12px}.brand{width:100%}.detail{top:118px;width:min(330px,calc(100% - 36px))}.hint{display:none}.weights{grid-template-columns:1fr 1fr}.scenario-note{width:100%;margin:0}}
</style>
</head>
<body>
<main class="app">
<header class="toolbar"><div class="brand"><div class="brand-mark">P4</div><div><strong>Plan4 网络分析图</strong><span>遮挡感知 · 质量门控 · 专家回退 · 高焦虑连续校准</span></div></div><button class="tool-btn" id="hiddenBtn">显示隐藏模块</button><button class="tool-btn" id="scenarioBtn">遮挡场景演示</button><button class="tool-btn" id="pathBtn">演示一次推理</button><button class="tool-btn" id="resetBtn">恢复布局</button></header>
<section class="workspace">
<div class="canvas-shell" id="shell"><div class="scene" id="scene"><div class="paper-grid"></div>
<div class="group input"><span class="group-label">多模态输入域</span></div><div class="group quality"><span class="group-label">质量诊断：当前证据是否可信</span></div><div class="group experts"><span class="group-label">五类候选专家池</span></div><div class="group gating"><span class="group-label">样本级动态门控</span></div><div class="group anxiety"><span class="group-label">高焦虑多任务与连续校准</span></div><div class="group output"><span class="group-label">最终预测</span></div>
<svg class="edges" viewBox="0 0 1580 900" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9ba9bd"/></marker></defs><g id="edgeLayer"></g></svg>
<button class="node face" data-id="frames" style="left:60px;top:200px"><strong>课堂图片序列</strong><span>每秒约2–3帧</span></button><button class="node struct" data-id="survey" style="left:60px;top:380px"><strong>前测问卷</strong><span>稳定个体风险</span></button><button class="node struct" data-id="context" style="left:60px;top:560px"><strong>课程与事件</strong><span>T1–T6 · 课堂结构</span></button><button class="node circle" data-id="sample" style="left:215px;top:365px"><strong>学生片段</strong><span>统一样本索引</span></button>
<button class="node quality-node" data-id="qualityFeatures" style="left:400px;top:130px"><strong>125维质量特征</strong><span>模糊 · 遮挡 · 亮度 · 检测率</span></button><button class="node face" data-id="faceReliability" style="left:515px;top:255px"><strong>人脸可靠性 q<sub>f</sub></strong><span>有效帧与清晰度</span></button><button class="node pose" data-id="bodyReliability" style="left:400px;top:350px"><strong>身体可靠性 q<sub>b</sub></strong><span>覆盖率与运动质心</span></button><button class="node quality-node" data-id="missing" style="left:540px;top:115px"><strong>双模态不可用 q<sub>m</sub></strong><span>触发回退</span></button>
<button class="node face" data-id="faceExpert" style="left:400px;top:535px"><strong>人脸时序专家</strong><span>表情 · 头姿 · 波动</span></button><button class="node pose" data-id="poseExpert" style="left:580px;top:535px"><strong>姿势运动专家</strong><span>动作频率 · 手脸距离</span></button><button class="node struct" data-id="structExpert" style="left:400px;top:685px"><strong>结构化问卷专家</strong><span>视觉失效仍可用</span></button><button class="node struct" data-id="fixedExpert" style="left:580px;top:685px"><strong>Plan3固定融合</strong><span>保留互补误差</span></button><button class="node time" data-id="timelineExpert" style="left:765px;top:685px"><strong>个人基线/时间轴</strong><span>稳定基线 + 片段偏移</span></button>
<button class="node quality-node hub pulse" data-id="gate" style="left:805px;top:190px"><strong>质量感知门控</strong><span>预测专家误差</span><code>w=softmax(−ê)</code></button><button class="node quality-node wide" data-id="constraints" style="left:770px;top:345px"><strong>可靠性约束</strong><span>脸差→限人脸；身体差→限姿势；都差→回退</span></button><button class="node final wide" data-id="mixture" style="left:820px;top:505px"><strong>动态专家融合</strong><code>p<sub>mix</sub>=Σ w<sub>k</sub>p<sub>k</sub></code><span>Σw<sub>k</sub>=1，w<sub>k</sub>≥0</span></button>
<button class="node hidden-module quality-node" data-id="oofError" hidden style="left:720px;top:105px"><strong>折外误差预测器</strong><span>只用其他训练折</span></button><button class="node hidden-module face" data-id="representative" hidden style="left:225px;top:180px"><strong>代表帧选择</strong><span>最清晰 · 最平静 · 最大波动</span></button><button class="node hidden-module time" data-id="shrinkage" hidden style="left:805px;top:790px"><strong>不确定性收缩</strong><span>样本少→靠近全局均值</span></button>
<button class="node risk-node" data-id="regression" style="left:1085px;top:200px"><strong>连续焦虑回归头</strong><span>预测6–24分</span></button><button class="node risk-node" data-id="classifier" style="left:1165px;top:355px"><strong>高焦虑分类头</strong><span>连续风险概率</span></button><button class="node risk-node" data-id="conditional" style="left:1085px;top:510px"><strong>高焦虑条件回归头</strong><span>高风险区连续分数</span></button><button class="node risk-node hub" data-id="calibrator" style="left:1200px;top:610px"><strong>连续概率校准</strong><span>保护高焦虑峰值</span></button>
<button class="node hidden-module risk-node" data-id="weightedLoss" hidden style="left:1160px;top:105px"><strong>连续样本加权</strong><span>焦虑分数 + Plan3折外误差</span></button><button class="node hidden-module quality-node" data-id="noDiffusion" hidden style="left:1035px;top:705px"><strong>不做扩散补全</strong><span>避免生成不存在的表情</span></button>
<button class="node final hub" data-id="finalGate" style="left:1395px;top:355px"><strong>质量与风险联合校准</strong><span>稳定融合</span></button><button class="node final wide" data-id="output" style="left:1375px;top:515px"><strong>Plan4焦虑预测</strong><span>质量门控 + 高焦虑校准</span></button>
<div class="legend"><span><i style="background:var(--face)"></i>人脸</span><span><i style="background:var(--pose)"></i>姿势</span><span><i style="background:var(--struct)"></i>结构化</span><span><i style="background:var(--quality)"></i>质量门控</span><span><i style="background:var(--time)"></i>时间轴</span><span><i style="background:var(--risk)"></i>高焦虑机制</span><span><i style="background:var(--final)"></i>输出</span></div>
</div></div>
<div class="zoom"><button id="zoomIn">＋</button><button id="zoomOut">−</button><button id="fit">⤢</button></div><div class="hint">拖动画布 · 拖动节点 · 点击节点查看分析</div>
<div class="narration" id="narration"><span class="narration-step" id="narrationStep">推理演示</span><strong id="narrationTitle">Plan4如何处理一段课堂视频</strong><span id="narrationText">点击“演示一次推理”，查看质量诊断、专家路由与高焦虑校准。</span><div class="progress"><i id="progressBar"></i></div></div>
<aside class="detail" id="detail"><div class="detail-head"><div class="detail-icon">i</div><div><h2 id="detailTitle">模块说明</h2><div class="type" id="detailType">点击任一节点</div></div><button class="close" id="detailClose">×</button></div><p id="detailText">这里展示该模块的作用、输入输出与设计理由。</p><dl><dt>输入</dt><dd id="detailInput">—</dd><dt>输出</dt><dd id="detailOutput">—</dd><dt>解决问题</dt><dd id="detailProblem">—</dd></dl><div class="formula" id="detailFormula">选择节点后显示公式或约束。</div></aside>
<section class="scenario" id="scenario"><div class="scenario-head"><strong>真实门控权重诊断</strong><select id="scenarioSelect"><option value="bothGood">双模态可用（n=2813）</option><option value="faceLow">人脸低、身体可用（n=23）</option><option value="bodyLow">人脸可用、身体低（n=44）</option><option value="bothLow">双模态低可靠（n=2）</option></select><span class="scenario-note" id="scenarioNote">各专家平均权重</span></div><div class="weights" id="weights"></div></section>
